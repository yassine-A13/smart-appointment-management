# Shared client settings for Eureka-registered services and the API Gateway.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Shared Actuator endpoints. Individual services may extend this list as needed.
management.endpoints.web.exposure.include=health,info,metrics

# Shared RabbitMQ development connection. Credentials are provided by each service environment.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
